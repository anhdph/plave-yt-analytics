# Step 2 only: verify GitHub Actions (IPv4) can reach Supabase via the Session pooler.
# Run manually from the Actions tab. Delete once pipeline.yml (step 8) is working.
name: db-check

on:
  workflow_dispatch:

jobs:
  db-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check DB connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tests/check_db_connection.py
